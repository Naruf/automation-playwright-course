name: Playwright Tests
on:
  push:
    branches: [main]
jobs:
  playwrighttests:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.32.1-focal
      env:
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Run tests
        run: |
          echo "Start the shopping store application"
          chmod +x ./shopping-store-linux-amd64
          ./shopping-store-linux-amd64 > app.log 2>&1 &
          echo "Install dependencies from lockfile"
          npm ci
          echo "Wait for the application"
          npx --yes wait-on -t 30000 tcp:127.0.0.1:2221 || { cat app.log; exit 1; }
          echo "Run playwright tests"
          npm run test:ci
